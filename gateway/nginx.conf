# Gateway config (Step 6b: routing + auth_request against authorization-api-stub).

events {}

http {
    log_format zt_json escape=json
        '{"time":"$time_iso8601","request_id":"$request_id",'
        '"method":"$request_method","uri":"$uri","status":$status,'
        '"upstream":"$upstream_addr","authz_status":"$upstream_status"}';

    access_log /dev/stdout zt_json;
    error_log  /dev/stderr warn;

    server {
        listen 80;

        set $req_id $http_x_request_id;
        if ($req_id = "") {
            set $req_id $request_id;
        }

        location /health {
            return 200 '{"service":"nginx-gateway","status":"ok"}';
            add_header Content-Type application/json;
        }

        # Internal-only: NGINX calls this itself via auth_request.
        # Not reachable directly by clients.
        location = /_authz {
            internal;
            proxy_pass http://authorization-api-stub:8006/authorize;
            proxy_pass_request_body off;
            proxy_set_header Content-Length "";
            proxy_set_header X-Original-URI $request_uri;
            proxy_set_header X-Request-ID $req_id;
        }

        location /employee/ {
            auth_request /_authz;
            proxy_pass http://employee-portal:8001/;
            proxy_set_header X-Request-ID $req_id;
            proxy_set_header X-User-Role "";
        }

        location /developer/ {
            auth_request /_authz;
            proxy_pass http://developer-api:8002/;
            proxy_set_header X-Request-ID $req_id;
            proxy_set_header X-User-Role "";
        }

        location /admin/ {
            auth_request /_authz;
            proxy_pass http://admin-panel:8003/;
            proxy_set_header X-Request-ID $req_id;
            proxy_set_header X-User-Role "";
        }
    }
}
