# Root integration file (Step 3: network skeleton with STUB services).
# Stubs are placeholders; each real service replaces its stub later.
# Every service lists its networks explicitly - nothing uses Docker's default network.

x-stub: &stub
  image: busybox:1.36
  command: ["sleep", "infinity"]
  restart: unless-stopped

services:
  # ---------- Gateway (P3) ----------
  nginx-gateway:
    image: nginx:alpine
    volumes:
      - ./gateway/nginx.conf:/etc/nginx/nginx.conf:ro
    ports:
      - "${GATEWAY_HTTP_PORT:-80}:80"
    networks: [gateway-network, app-network, backend-network]

  # ---------- Protected test services (P3) ----------
  employee-portal:
    build: ./services/employee-portal
    networks: [app-network, monitoring-network]

  developer-api:
    build: ./services/developer-api
    networks: [app-network, monitoring-network]

  admin-panel:
    build: ./services/admin-panel
    networks: [app-network, monitoring-network]

  # ---------- Database (P3) ----------
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./infrastructure/postgres-init:/docker-entrypoint-initdb.d:ro
    networks: [database-network]

  # ---------- Other people's services (stubs until they deliver) ----------
  keycloak:
    <<: *stub
    networks: [identity-network]

  authorization-api:
    <<: *stub
    networks: [backend-network, identity-network, database-network, monitoring-network]

  opa:
    <<: *stub
    networks: [backend-network]

  device-registry:
    <<: *stub
    networks: [backend-network, database-network, monitoring-network]

  risk-engine:
    <<: *stub
    networks: [backend-network, database-network, monitoring-network]

networks:
  gateway-network:      # reachable from the host (NGINX publishes ports here)
  identity-network:     # Keycloak side
  monitoring-network:   # Wazuh + log producers
  app-network:
    internal: true      # no route to host/internet
  backend-network:
    internal: true
  database-network:
    internal: true      # database can never reach out or be reached from outside

volumes:
  postgres-data:
