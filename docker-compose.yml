# Root integration file.
# Each protected app sits on its own dedicated network with nginx-gateway,
# so the apps cannot reach each other directly (see docs/evidence for the
# lateral-movement test this fixed).

x-stub: &stub
  image: busybox:1.36
  command: ["sleep", "infinity"]
  restart: unless-stopped

services:
  # ---------- Gateway (P3) ----------
  nginx-gateway:
    image: nginx:alpine
    volumes:
      - ./gateway/nginx.conf:/etc/nginx/nginx.conf:ro
    ports:
      - "${GATEWAY_HTTP_PORT:-80}:80"
    networks: [gateway-network, employee-network, developer-network, admin-network, backend-network]

  # ---------- Protected test services (P3) ----------
  # Each app is isolated on its own network, shared only with nginx-gateway.
  employee-portal:
    build: ./services/employee-portal
    networks: [employee-network]

  developer-api:
    build: ./services/developer-api
    networks: [developer-network]

  admin-panel:
    build: ./services/admin-panel
    networks: [admin-network]

  authorization-api-stub:
    build: ./services/authorization-api-stub
    networks: [backend-network]

  # ---------- Database (P3) ----------
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./infrastructure/postgres-init:/docker-entrypoint-initdb.d:ro
    networks: [database-network]

  # ---------- Other people's services (stubs until they deliver) ----------
  keycloak:
    <<: *stub
    networks: [identity-network]

  authorization-api:
    <<: *stub
    networks: [backend-network, identity-network, database-network, monitoring-network]

  opa:
    <<: *stub
    networks: [backend-network]

  device-registry:
    <<: *stub
    networks: [backend-network, database-network, monitoring-network]

  risk-engine:
    <<: *stub
    networks: [backend-network, database-network, monitoring-network]

networks:
  gateway-network:      # reachable from the host (NGINX publishes ports here)
  identity-network:     # Keycloak side
  monitoring-network:   # for Wazuh, wired in properly in Step 8
  employee-network:
    internal: true      # nginx-gateway <-> employee-portal only
  developer-network:
    internal: true      # nginx-gateway <-> developer-api only
  admin-network:
    internal: true       # nginx-gateway <-> admin-panel only
  backend-network:
    internal: true
  database-network:
    internal: true      # database can never reach out or be reached from outside

volumes:
  postgres-data:
